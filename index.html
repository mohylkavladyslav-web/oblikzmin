<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Облік змін</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F2F3F6;
      --surface: #FFFFFF;
      --text: #14151A;
      --text-muted: #6B7280;
      --border: #E4E6EB;
      --accent: #3454D1;
      --accent-hover: #2942A8;
      --accent-tint: #EBEFFC;
      --success: #16A34A;
      --success-hover: #128239;
      --secondary-bg: #F1F2F5;
      --secondary-text: #374151;
      --secondary-border: #DDE0E6;
      --share: #0D9488;
      --share-hover: #0B7C71;
      --danger: #DC2626;
      --geo: #0284C7;
      --geo-hover: #0369A1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 24px 16px;
      background-color: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(20, 21, 26, 0.04), 0 8px 24px rgba(20, 21, 26, 0.06);
      max-width: 440px;
      margin: 0 auto 16px auto;
    }

    h2, h3 {
      font-family: 'Manrope', sans-serif;
      margin-top: 0;
      text-align: center;
      letter-spacing: -0.02em;
    }

    h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    h3 { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
    p { color: var(--text-muted); font-size: 14px; text-align: center; }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 13px;
      color: var(--text-muted);
    }

    input[type="text"], select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-tint);
    }

    input[readonly] {
      background-color: var(--secondary-bg);
      color: var(--secondary-text);
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-primary { background-color: var(--accent); color: white; }
    .btn-primary:hover { background-color: var(--accent-hover); }

    .btn-success { background-color: var(--success); color: white; }
    .btn-success:hover { background-color: var(--success-hover); }

    .btn-secondary {
      background-color: var(--secondary-bg);
      color: var(--secondary-text);
      border: 1px solid var(--secondary-border);
    }
    .btn-secondary:hover { background-color: #E9EBEF; }

    .btn-share { background-color: var(--share); color: white; }
    .btn-share:hover { background-color: var(--share-hover); }

    .btn-geo, #startGeoBtn {
      background-color: #0284C7 !important;
      color: #FFFFFF !important;
      border: none !important;
    }
    .btn-geo:hover, #startGeoBtn:hover {
      background-color: #0369A1 !important;
    }

    #startGeoStatus, #endGeoStatus {
      width: 100%;
      padding: 4px 6px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      text-align: center;
    }

    .hidden { display: none; }

    .status-msg {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      color: var(--danger);
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Облік змін</h2>

  <div id="authSection">
    <p style="text-align: center;">Увійдіть через Telegram для продовження</p>
    <div style="text-align: center;" id="telegramLoginContainer">
      <script async src="https://telegram.org/js/telegram-widget.js?22" 
              data-telegram-login="oblikzmin_bot" 
              data-size="large" 
              data-onauth="onTelegramAuth(user)" 
              data-request-access="write"></script>
    </div>
    <div id="authError" class="status-msg"></div>
  </div>

  <div id="menuSection" class="hidden">
    <h3>Виберіть дію</h3>
    <button class="btn-primary" onclick="showStartForm()">Розпочати зміну</button>
    <button class="btn-secondary" onclick="handleEndShiftClick()">Завершити зміну</button>
  </div>

  <!-- Форма початку зміни -->
  <div id="startShiftForm" class="hidden">
    <h3>Розпочати зміну</h3>
    <form id="startForm">
      <div class="form-group">
        <label>Інспектор:</label>
        <input type="text" id="startInspectorName" readonly>
        <select id="startInspectorSelect" class="hidden"></select>
      </div>
      <div class="form-group">
        <label>ЗЗСО:*</label>
        <select id="startZzso" required></select>
      </div>
      <div class="form-group">
        <label>Дата:*</label>
        <input type="text" id="startDate" readonly>
      </div>
      <div class="form-group">
        <label>Час початку зміни:*</label>
        <input type="text" id="startTime" readonly>
      </div>
      <div class="form-group">
        <label>Розташування:*</label>
        <button type="button" id="startGeoBtn" class="btn-geo" onclick="getStartGeo()">Отримати геолокацію</button>
        <input type="text" id="startGeoStatus" readonly style="margin-top: 5px;" placeholder="Геолокацію не отримано">
      </div>
      <div class="form-group">
        <label>В системі:*</label>
        <select id="startInSystem" required>
          <option value="Ні" selected>Ні</option>
          <option value="Так">Так</option>
        </select>
      </div>
      <button type="submit" class="btn-success">Надіслати</button>
      <button type="button" class="btn-secondary" onclick="cancelToMenu('startShiftForm')">Скасувати</button>
    </form>
  </div>

  <!-- Форма вибору зміни для Апарату -->
  <div id="endShiftAparatForm" class="hidden">
    <h3>Завершення зміни (Апарат)</h3>
    <div class="form-group">
      <label>Оберіть відкриту зміну:*</label>
      <select id="openShiftsSelect"></select>
    </div>
    <button class="btn-success" onclick="confirmEndShiftAparat()">Завершити обрану зміну</button>
    <button class="btn-secondary" onclick="cancelToMenu('endShiftAparatForm')">Скасувати</button>
  </div>

  <!-- Секція результату -->
  <div id="resultSection" class="hidden">
    <h3 id="resultTitle">Дані успішно відправлено!</h3>
    <div id="shareTextPreview" style="white-space: pre-wrap; background: #f8f9fa; padding: 10px; border: 1px solid #ddd; margin-bottom: 10px;"></div>
    <button class="btn-share" onclick="shareData()">Поділитись</button>
    <button class="btn-secondary" style="margin-top: 8px;" onclick="location.reload()">На головну</button>
  </div>

  <div id="globalLoader" class="status-msg hidden">Завантаження...</div>
</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwBWTPWrmaFkYUaHhxBjLDl68f8G6_4MELK4Tjv2tULDpBnPJVO25QOJbCqzbg6hm-I/exec";

  let currentUser = null;
  let authData = null;
  let currentStartGeo = { lat: null, lng: null, time: null };
  let shareMessageText = "";

  // Збір цифрового сліду пристрою
  function getDeviceFingerprint() {
    return {
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      language: navigator.language,
      screenResolution: `${screen.width}x${screen.height}`,
      colorDepth: screen.colorDepth,
      timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      hardwareConcurrency: navigator.hardwareConcurrency || "Н/Д",
      deviceMemory: navigator.deviceMemory || "Н/Д",
      touchSupport: ('ontouchstart' in window) || (navigator.maxTouchPoints > 0)
    };
  }

  document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    const telegramId = urlParams.get('id');

    if (telegramId) {
      const user = {
        id: telegramId,
        first_name: urlParams.get('first_name') || '',
        username: urlParams.get('username') || ''
      };

      window.history.replaceState({}, document.title, window.location.pathname);
      onTelegramAuth(user);
    }
  });

  function onTelegramAuth(user) {
    currentUser = user;
    showLoader(true);
    
    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "checkAuth", telegramId: user.id })
    })
    .then(res => res.json())
    .then(data => {
      showLoader(false);
      if (data.status === "success") {
        authData = data;
        document.getElementById("authSection").classList.add("hidden");
        document.getElementById("menuSection").classList.remove("hidden");
      } else {
        document.getElementById("authError").innerText = data.message || "Доступ заборонено.";
      }
    })
    .catch(err => {
      showLoader(false);
      console.error(err);
      document.getElementById("authError").innerText = "Помилка зв'язку з сервером.";
    });
  }

  function showStartForm() {
    document.getElementById("menuSection").classList.add("hidden");
    document.getElementById("startShiftForm").classList.remove("hidden");

    const now = new Date();
    document.getElementById("startDate").value = now.toISOString().split('T')[0];
    document.getElementById("startTime").value = now.toTimeString().split(' ')[0].substring(0, 5);

    const zzsoSelect = document.getElementById("startZzso");
    zzsoSelect.innerHTML = '<option value="">-- Оберіть ЗЗСО --</option>';
    authData.zzsoList.forEach(item => {
      zzsoSelect.innerHTML += `<option value="${item}">${item}</option>`;
    });

    if (authData.role === "aparat") {
      document.getElementById("startInspectorName").classList.add("hidden");
      const inspSelect = document.getElementById("startInspectorSelect");
      inspSelect.classList.remove("hidden");
      inspSelect.innerHTML = '<option value="">-- Оберіть інспектора --</option>';
      authData.inspectorsList.forEach(item => {
        inspSelect.innerHTML += `<option value="${item}">${item}</option>`;
      });
    } else {
      document.getElementById("startInspectorName").value = authData.inspectorName;
    }
  }

  function getStartGeo() {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(position => {
        const now = new Date();
        currentStartGeo.lat = position.coords.latitude;
        currentStartGeo.lng = position.coords.longitude;
        currentStartGeo.time = now.toTimeString().split(' ')[0].substring(0, 5);

        document.getElementById("startGeoStatus").value = `Широта: ${currentStartGeo.lat.toFixed(4)}, Довгота: ${currentStartGeo.lng.toFixed(4)}`;
      }, () => {
        alert("Не вдалося отримати геолокацію. Дозвольте доступ до геопозиції.");
      });
    } else {
      alert("Геолокація не підтримується вашим браузером.");
    }
  }

  document.getElementById("startForm").addEventListener("submit", function(e) {
    e.preventDefault();
    if (!currentStartGeo.lat) {
      alert("Будь ласка, отримайте геолокацію перед відправкою!");
      return;
    }

    const inspector = authData.role === "aparat" 
      ? document.getElementById("startInspectorSelect").value 
      : document.getElementById("startInspectorName").value;

    if (!inspector) {
      alert("Будь ласка, оберіть інспектора!");
      return;
    }

    const payload = {
      action: "startShift",
      telegramId: currentUser.id,
      inspector: inspector,
      zzso: document.getElementById("startZzso").value,
      date: document.getElementById("startDate").value,
      startTime: document.getElementById("startTime").value,
      inSystem: document.getElementById("startInSystem").value,
      lat: currentStartGeo.lat,
      lng: currentStartGeo.lng,
      geoTime: currentStartGeo.time,
      fingerprint: getDeviceFingerprint()
    };

    showLoader(true);
    fetch(WEB_APP_URL, { 
      method: "POST", 
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload) 
    })
      .then(res => res.json())
      .then(data => {
        showLoader(false);
        if (data.status === "success") {
          document.getElementById("startShiftForm").classList.add("hidden");
          shareMessageText = `${payload.zzso}\n${payload.inspector}\nПочаток зміни: ${payload.startTime}\nВ системі: ${payload.inSystem}\nID: ${data.responseId}`;
          document.getElementById("shareTextPreview").innerText = shareMessageText;
          document.getElementById("resultSection").classList.remove("hidden");
        } else {
          alert(data.message || "Помилка при збереженні зміни.");
        }
      })
      .catch(err => {
        showLoader(false);
        alert("Помилка відправки даних.");
      });
  });

  function handleEndShiftClick() {
    if (authData.role === "aparat") {
      showLoader(true);
      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "getOpenShifts" })
      })
      .then(res => res.json())
      .then(data => {
        showLoader(false);
        if (data.status === "success" && data.openShifts.length > 0) {
          const select = document.getElementById("openShiftsSelect");
          select.innerHTML = '<option value="">-- Оберіть зміну --</option>';
          data.openShifts.forEach(shift => {
            select.innerHTML += `<option value="${shift.rowIndex}">${shift.inspector} — ${shift.zzso} (${shift.date} ${shift.startTime})</option>`;
          });
          document.getElementById("menuSection").classList.add("hidden");
          document.getElementById("endShiftAparatForm").classList.remove("hidden");
        } else {
          alert("Наразі немає відкритих змін.");
        }
      })
      .catch(err => {
        showLoader(false);
        alert("Помилка при отриманні списку змін.");
      });
    } else {
      executeEndShift(null);
    }
  }

  function confirmEndShiftAparat() {
    const selectedRowIndex = document.getElementById("openShiftsSelect").value;
    if (!selectedRowIndex) {
      alert("Будь ласка, оберіть зміну з переліку!");
      return;
    }
    executeEndShift(selectedRowIndex);
  }

  function executeEndShift(selectedRowIndex) {
    if (!("geolocation" in navigator)) {
      alert("Геолокація не підтримується.");
      return;
    }

    showLoader(true);
    navigator.geolocation.getCurrentPosition(position => {
      const now = new Date();
      const endTime = now.toTimeString().split(' ')[0].substring(0, 5);
      const geoTime = endTime;
      const todayDate = now.toISOString().split('T')[0];

      const payload = {
        action: "endShift",
        telegramId: currentUser.id,
        selectedRowIndex: selectedRowIndex,
        date: todayDate,
        endTime: endTime,
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        geoTime: geoTime,
        fingerprint: getDeviceFingerprint()
      };

      fetch(WEB_APP_URL, { 
        method: "POST", 
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload) 
      })
        .then(res => res.json())
        .then(data => {
          showLoader(false);
          if (data.status === "success") {
            document.getElementById("menuSection").classList.add("hidden");
            document.getElementById("endShiftAparatForm").classList.add("hidden");
            
            shareMessageText = `${data.zzso}\n${data.inspector}\nЧас завершення зміни: ${endTime}\nID: ${data.responseId}`;
            document.getElementById("shareTextPreview").innerText = shareMessageText;
            document.getElementById("resultSection").classList.remove("hidden");
          } else {
            alert(data.message || "Не вдалося знайти запис для завершення зміни.");
          }
        })
        .catch(err => {
          showLoader(false);
          alert("Помилка відправки даних.");
        });
    }, () => {
      showLoader(false);
      alert("Не вдалося отримати геолокацію для завершення зміни.");
    });
  }

  function shareData() {
    if (navigator.share) {
      navigator.share({
        title: 'Облік змін',
        text: shareMessageText
      }).catch(err => console.log('Скасовано обмін'));
    } else {
      navigator.clipboard.writeText(shareMessageText).then(() => {
        alert("Текст скопійовано в буфер обміну!");
      });
    }
  }

  function cancelToMenu(fromId) {
    document.getElementById(fromId).classList.add("hidden");
    document.getElementById("menuSection").classList.remove("hidden");
  }

  function showLoader(show) {
    document.getElementById("globalLoader").classList.toggle("hidden", !show);
  }
</script>
</body>
</html>
